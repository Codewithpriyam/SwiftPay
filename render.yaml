services:
  - type: web
    name: swiftpay-backend
    env: docker
    plan: free
    healthCheckPath: /api/status
    initialDelaySeconds: 120
    readinessProbe:
      httpGet:
        path: /api/status
        port: 8080
      initialDelaySeconds: 120
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: JAVA_VERSION
        value: 17
