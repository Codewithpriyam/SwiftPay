plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.offlinepay'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.offlinepay"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildToolsVersion "34.0.0"
}

dependencies {
    // AndroidX Core & AppCompat
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.12.0'

    // Liquid Glass Blur
    implementation 'com.github.Dimezis:BlurView:version-2.0.3'

    // Lottie animations
    implementation 'com.airbnb.android:lottie:6.0.0'

    // Google Tink for encryption (android variant)
    implementation 'com.google.crypto.tink:tink-android:1.12.0'

    // Google Nearby Connections (for Mesh Network)
    implementation 'com.google.android.gms:play-services-nearby:19.0.0'

    // OkHttp — fetch server public key
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // QR Code Scanner (ZXing)
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // Spring physics for touch interactions
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'

    // Tests
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
