# ============================================================
#  OfflinePay — Spring Boot Application Configuration
# ============================================================
spring.application.name=offline-pay-server

# ------------------------------------------------------------
# PostgreSQL Database
# ------------------------------------------------------------
# PostgreSQL Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/offline_pay_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ------------------------------------------------------------
# Server
# ------------------------------------------------------------
server.port=8080
server.servlet.context-path=/

# ------------------------------------------------------------
# Twilio Credentials
# (Replace with real values or use environment variables)
# ------------------------------------------------------------
twilio.account-sid=${TWILIO_ACCOUNT_SID:ACplaceholder}
twilio.auth-token=${TWILIO_AUTH_TOKEN:placeholder_token}
twilio.from-number=${TWILIO_FROM_NUMBER:+15005550006}

# ------------------------------------------------------------
# Logging
# ------------------------------------------------------------
logging.level.com.example.offlinepay=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
